name: Diagnose stalled macOS release
on:
  push:
    branches: ['codex/diagnose-release-1.2.4']
permissions:
  contents: read
  actions: write
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop stalled verification and collect logs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_RUN: '39216003034'
        shell: bash
        run: |
          set -euo pipefail
          status="$(gh api "repos/$GH_REPO/actions/runs/$TARGET_RUN" --jq .status)"
          if [ "$status" != completed ]; then
            gh api --method POST "repos/$GH_REPO/actions/runs/$TARGET_RUN/cancel"
          fi
          for attempt in $(seq 1 40); do
            status="$(gh api "repos/$GH_REPO/actions/runs/$TARGET_RUN" --jq .status)"
            if [ "$status" = completed ]; then break; fi
            sleep 3
          done
          gh run view "$TARGET_RUN" --log > previous-run.log
          tail -100 previous-run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stalled-release-logs
          path: previous-run.log
          retention-days: 7
  mac-probe:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.2.4
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: '3.12.15'
          enable-cache: false
      - name: Prepare exact Python and trace loopback startup
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.12.15 --seed .build-desktop-venv
          .build-desktop-venv/bin/python -m pip install -r desktop/requirements-build.txt
          .build-desktop-venv/bin/python - <<'PY'
          import os, sys, subprocess, pathlib, tempfile, json, time
          print('EXACT PYTHON', sys.executable, sys.version, flush=True)
          assert sys.version_info[:3] == (3, 12, 15)
          reports = pathlib.Path('probe-reports'); reports.mkdir()
          probes = {
              'dns': "import socket,time,faulthandler;faulthandler.dump_traceback_later(5);t=time.monotonic();print(socket.getfqdn('127.0.0.1'),time.monotonic()-t,flush=True)",
              'server': "import sys,runpy,faulthandler;faulthandler.dump_traceback_later(5);sys.argv=['ui_server.py','--port','0'];runpy.run_path('ui_server.py',run_name='__main__')",
          }
          for name, code in probes.items():
              with tempfile.TemporaryDirectory() as data:
                  env = dict(os.environ, GUIZANG_DATA=data, GUIZANG_BOOKS=data+'/books')
                  p = subprocess.Popen([sys.executable, '-u', '-c', code], env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  try: out, _ = p.communicate(timeout=12)
                  except subprocess.TimeoutExpired:
                      p.terminate(); out, _ = p.communicate(timeout=10)
                  (reports/(name+'.log')).write_bytes(out)
                  print(name, out.decode(errors='replace'), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-loopback-probe
          path: probe-reports/
          retention-days: 7

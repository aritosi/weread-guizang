name: macOS installer release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag (for example v1.2.3)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check release identity
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = re.search(r'^VERSION\s*=\s*"([^"]+)"', pathlib.Path('ui_server.py').read_text(), re.M)[1]
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag and application version differ'
          assert pathlib.Path('.github/releases/' + os.environ['RELEASE_TAG'] + '.md').is_file()
          PY
          test "$(uname -m)" = arm64
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build self-contained DMG
        run: bash desktop/build_macos.sh
      - name: Source regression gates
        shell: bash
        run: |
          set -euo pipefail
          ln -s .build-desktop-venv .venv
          mkdir -p dist/macos/test-results
          bash tests/run_all.sh --fast 2>&1 | tee dist/macos/test-results/source-regression.log
      - name: Install DMG and test bundled runtime
        shell: bash
        run: |
          set -euo pipefail
          .build-desktop-venv/bin/python desktop/test_installed.py \
            "dist/macos/归藏-${RELEASE_TAG#v}-arm64.dmg" \
            --output "$RUNNER_TEMP/guizang-installed" \
            2>&1 | tee dist/macos/test-results/installed-acceptance.log
      - name: Test installed UI and drag persistence
        shell: bash
        run: |
          set -euo pipefail
          resources="$RUNNER_TEMP/guizang-installed/Applications/归藏.app/Contents/Resources"
          .build-desktop-venv/bin/python desktop/test_ui_optimizations.py \
            --backend "$resources/backend/guizang-backend" \
            --browser-path "$resources/browsers" \
            --output dist/macos/test-results/ui \
            2>&1 | tee dist/macos/test-results/ui-acceptance.log
      - name: Prepare checksums, notices and evidence
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/guizang-installed/installation-result.json" dist/macos/test-results/
          cp "$RUNNER_TEMP/guizang-installed/runtime-self-test.json" dist/macos/test-results/
          cp dist/desktop/app-native-audit.json dist/macos/test-results/
          cp dist/desktop/dependency-manifest.json dist/macos/test-results/
          cp desktop/INSTALL.txt dist/macos/安装说明.txt
          cp desktop/TEST_RESULTS.md dist/macos/LOCAL_TEST_RESULTS.md
          ditto dist/desktop/licenses dist/macos/third-party-notices/licenses
          ditto dist/desktop/media/provenance.json dist/macos/third-party-notices/media-provenance.json
          cp dist/desktop/media/*LICENSE.txt dist/desktop/media/COPYING.GPLv3 dist/macos/third-party-notices/
          (cd dist/macos && zip -qr test-results.zip test-results && zip -qr third-party-notices.zip third-party-notices)
          (cd dist/macos && shasum -a 256 "归藏-${RELEASE_TAG#v}-arm64.dmg" \
            test-results.zip third-party-notices.zip > SHA256SUMS.txt)
      - name: Publish tested installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "归藏 ${RELEASE_TAG#v} · macOS 独立版" \
            --notes-file ".github/releases/$RELEASE_TAG.md" \
            "dist/macos/归藏-${RELEASE_TAG#v}-arm64.dmg" \
            dist/macos/SHA256SUMS.txt dist/macos/test-results.zip \
            dist/macos/third-party-notices.zip dist/macos/安装说明.txt \
            dist/macos/LOCAL_TEST_RESULTS.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-diagnostics
          path: |
            dist/macos/test-results/
            dist/desktop/*audit.json
            dist/desktop/dependency-manifest.json
          retention-days: 14
          if-no-files-found: ignore

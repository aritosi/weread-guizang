[package]
name = "guizang-desktop"
version = "1.2.4"
description = "归藏 · 微信读书与知识工具"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "unwind"
